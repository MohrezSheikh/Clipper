name: Release

# Every tag `vX.Y.Z` builds the .deb and publishes it on the GitHub release —
# users download it and install with:  sudo apt install ./clipper_X.Y.Z_all.deb

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Figure out version from tag
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        run: ./dist/deb.sh "${{ steps.ver.outputs.VERSION }}"

      - name: Hashes
        run: |
          cd dist
          sha256sum clipper_*_all.deb > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/clipper_*_all.deb
            dist/SHA256SUMS
          generate_release_notes: true
